replicaCount: 2

environment: local

image:
  repository: ghcr.io/REPLACE_WITH_GITHUB_OWNER/orderflow
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 10
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 20

config:
  redisHost: redis
  redisPort: "6379"
  kafkaBootstrapServers: kafka:9092
  schemaRegistryUrl: http://schema-registry:8081

secrets:
  # Create this Secret separately; do not put real credentials in values.yaml.
  existingSecret: orderflow-secrets
  mongodbUriKey: mongodb-uri

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""

retry:
  enabled: false
  replicaCount: 1
  command: []
  args: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
